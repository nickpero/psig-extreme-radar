name: PSIG Extreme Radar — Research

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * 1"

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Historical catalogue
        run: python -m scanner.psig_phase1
      - name: Event study
        run: python -m scanner.psig_event_study
      - name: Phase 1C pattern discovery
        run: python -m scanner.psig_pattern_discovery
      - name: Run tests
        run: pytest -q
      - name: Commit research outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/psig
          git diff --cached --quiet && exit 0
          git commit -m "Update PSIG research outputs [skip ci]"
          git push
