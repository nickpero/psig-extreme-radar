name: PSIG Extreme Radar — Research

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * 1"

permissions:
  contents: read

jobs:
  research:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Historical catalogue
        run: python -m scanner.psig_phase1
      - name: Event study
        run: python -m scanner.psig_event_study
      - name: Phase 1C pattern discovery
        run: python -m scanner.psig_pattern_discovery
      - name: Run tests
        run: pytest -q
      - name: Commit research outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/psig
          git diff --cached --quiet && exit 0
          git commit -m "Update PSIG research outputs [skip ci]"
          git push
